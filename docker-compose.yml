version: '3.9'

services:
  # ── Production bot (SQLite on named volume) ──────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/bot.db
      NODE_ENV: production
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Development bot (hot-reload, source mounted) ──────────────────────────────
  bot-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["dev"]
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/bot-dev.db
      NODE_ENV: development
      LOG_PRETTY: "true"
      LOG_LEVEL: debug
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - bot_dev_data:/app/data

volumes:
  bot_data:
  bot_dev_data:
