name: Keep Render instance warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --max-time 90 --retry 2 --retry-delay 5 \
            https://discord-security-bot-8mi6.onrender.com/
